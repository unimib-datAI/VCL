services:
  dql-mongodb:
    image: mongo:4.4.6
    container_name: dql-mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    ports:
      - "28017:27017"
    volumes:
      - ./data:/data/db
    networks:
      - dql-net

  dql-system:
    build: .
    container_name: dql-system
    depends_on:
      - dql-mongodb
    restart: always
    expose:
      - "8501"
      - "9000"
    volumes:
      - ./settings:/app/settings
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - dql-net

  dql-caddy:
    image: caddy:2-alpine
    container_name: dql-caddy
    restart: always
    depends_on:
      - dql-system
    ports:
      - "15000:80"
      - "15500:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - dql-net

volumes:
  caddy_data:
  caddy_config:

networks:
  dql-net:
    driver: bridge